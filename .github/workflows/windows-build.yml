name: Windows installer build
on:
  workflow_dispatch:
  push:
    branches: [fix/windows-cua-browser-and-discovery]
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Run Python test suite
        run: python -B -m unittest discover -s tests -v
      - name: Run frontend test suite
        run: npm run test:desktop
      - name: Run updater tests
        run: npm run test:updater
      - name: Build Windows gateway runtime
        run: python scripts/build-desktop.py
      - name: Build Windows NSIS installer and portable ZIP
        run: npm run build:windows
      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-Windows-x64
          if-no-files-found: error
          path: |
            dist/desktop/*.exe
            dist/desktop/*.zip
